[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-fusion"
version = "0.1.0"
description = "Open source intelligence aggregation, MinHash deduplication, and entity graph engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Juan De Andrade", email = "cibi-dev@users.noreply.github.com"}]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "networkx>=3.2.0,<4.0.0",
    "httpx>=0.25.0,<1.0.0",
    "typer>=0.9.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "bandit>=1.7.0",
]

[project.scripts]
osint-fusion = "osint_fusion.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
