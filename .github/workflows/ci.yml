name: CI DevSecOps & Test Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  devsecops-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" cyclonedx-bom

      - name: 🔒 1. Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ 2. Static Application Security Testing (Bandit)
        run: |
          bandit -r src/ -ll

      - name: 🧪 3. Pytest Suite
        run: |
          pytest -v

      - name: 📦 4. Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment -o sbom.json
