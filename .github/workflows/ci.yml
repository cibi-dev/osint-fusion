name: CI DevSecOps & Test Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov cyclonedx-bom

      - name: 🔒 1. Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LOG_OPTS: "--no-merges --all"

      - name: 🛡️ 2. Static Application Security Testing (Bandit)
        run: |
          bandit -r src/ -ll

      - name: 🧪 3. Unit & Integration Test Suite (Coverage >= 90%)
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-fail-under=90

      - name: 📦 4. Software Bill of Materials (CycloneDX SBOM)
        run: |
          cyclonedx-py environment -o sbom.json

      - name: 📤 5. Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
          if-no-files-found: warn
